name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
          - { os: ubuntu-22.04,   name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      # CPU-only PyTorch keeps the bundle hundreds of MB smaller than the CUDA build.
      - name: Install CPU PyTorch
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-desktop.txt

      - name: Run tests
        run: pytest -q
        env:
          GEMINI_API_KEY: dummy

      - name: Build with PyInstaller
        run: pyinstaller docent.spec --noconfirm

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" -replace '^v','' } else { "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\docent.iss

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          hdiutil create -volname Docent -srcfolder dist/Docent.app -ov -format UDZO release/Docent-macos.dmg

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/Docent-linux.tar.gz -C dist Docent

      - uses: actions/upload-artifact@v4
        with:
          name: docent-${{ matrix.name }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
